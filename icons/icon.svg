<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3820" />
      <stop offset="50%" stop-color="#244b2c" />
      <stop offset="100%" stop-color="#2e5933" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#508c56" />
      <stop offset="100%" stop-color="#3d785a" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f6f1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c25746" />
      <stop offset="100%" stop-color="#a84334" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- House Structure -->
  <!-- Roof -->
  <path d="M 110 260 L 256 128 L 402 260 L 374 288 L 256 182 L 138 288 Z" fill="url(#roofGrad)" filter="url(#glow)" />
  
  <!-- Chimney -->
  <rect x="336" y="152" width="36" height="64" rx="6" fill="#2e5933" />
  
  <!-- Walls -->
  <path d="M 148 270 L 364 270 L 364 416 A 16 16 0 0 1 348 432 L 164 432 A 16 16 0 0 1 148 416 Z" fill="url(#wallGrad)" opacity="0.98" />

  <!-- Door / Portal -->
  <path d="M 224 432 L 224 326 A 32 32 0 0 1 288 326 L 288 432 Z" fill="#19331d" />
  
  <!-- Heart over Door (Couple) -->
  <path d="M 256 314 C 256 298, 236 288, 224 302 C 212 315, 226 332, 256 352 C 286 332, 300 315, 288 302 C 276 288, 256 298, 256 314 Z" fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Windows (Left & Right) -->
  <rect x="174" y="300" width="36" height="36" rx="8" fill="#3d785a" opacity="0.85" />
  <rect x="302" y="300" width="36" height="36" rx="8" fill="#3d785a" opacity="0.85" />
</svg>